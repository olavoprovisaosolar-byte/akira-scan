name: Nexus Full Sync (Cloud)

# Backfill completo NexusToons → AkiraScan na nuvem.
# Roda sozinho: checkpoint git a cada 30 min + re-dispara até fila vazia.
# PC pode ficar desligado.

# Merge neste ficheiro (ou nos scripts abaixo) dispara o backfill na hora —
# para o PC poder desligar. Commits só em data/*.json NÃO re-disparam.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexus-full-sync-cloud.yml"
      - "scripts/cloud-hyper-run.mjs"
      - "scripts/run-bulk-migration.mjs"
      - "scripts/lib/supervised-spawn.mjs"
      - "bots/nexustoons-akira/capture/nexustoons.js"
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Cloudflare ao concluir cada rodada"
        required: false
        type: boolean
        default: false
      manga_parallel:
        description: "Mangás paralelos (2 no runner free)"
        required: false
        default: "2"

permissions:
  contents: write
  actions: write

concurrency:
  group: nexus-full-sync-cloud
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Estado inicial
        run: |
          node scripts/check-full-sync-pending.mjs || true
          if [ -f data/cloud/chapters-index.json ]; then
            node -e "const i=require('./data/cloud/chapters-index.json'); console.log('cloud caps:', Object.keys(i.caps||{}).length)"
          fi

      - name: Backfill hyper (catálogo completo, todos os caps)
        env:
          SYNC_INTERVAL_MINUTES: "30"
          MIGRATE_LOOP: "1"
          MIGRATE_LOOP_MAX_MS: "21000000"
          NEXUSTOONS_FULL_CATALOG: "1"
          NEXUSTOONS_ALL_CHAPTERS: "1"
          NEXUSTOONS_MANGA_PARALLEL: ${{ inputs.manga_parallel || '2' }}
          NEXUSTOONS_CHAPTER_CONCURRENCY: "4"
          NEXUSTOONS_PW_POOL_SIZE: "4"
          NEXUSTOONS_USE_PLAYWRIGHT: "1"
          TELEGRA_SKIP: "1"
          HOSTING_ADAPTER: catbox
          NEXUSTOONS_HOSTING_ADAPTER: catbox
          CATBOX_FORCE_FREEIMAGE: "1"
          CATBOX_SKIP: "true"
          LITTERBOX_SKIP: "1"
          CATBOX_STATIC_FALLBACK: "false"
          NEXUSTOONS_PURGE_LOCAL: "1"
          AKIRA_SKIP_CLOUD_PAGES: "1"
          NEXUSTOONS_DEFER_CATALOG: "1"
          NEXUSTOONS_OVERLAP_PIPELINE: "1"
          SHARP_SKIP_REENCODE: "1"
          NEXUSTOONS_PW_LITE: "1"
          NEXUSTOONS_PW_BLOCK_HEAVY: "1"
          NEXUSTOONS_DELAY_MS: "0"
          NEXUSTOONS_CHAPTER_DELAY_MS: "0"
          FREEIMAGE_DELAY_MS: "0"
          STREAM_PAGE_CONCURRENCY: "24"
          STREAM_PAGE_MAX: "24"
          PAGE_DOWNLOAD_CONCURRENCY: "24"
          NEXUSTOONS_STATE_SAVE_EVERY: "5"
          CF_PAGES_PROJECT: akira-scan
          CF_PAGES_BRANCH: main
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AKIRA_PUBLISH_TOKEN: ${{ secrets.AKIRA_PUBLISH_TOKEN }}
          AKIRA_PUBLISH_BASE_URL: https://akira-scan.pages.dev
          AKIRA_SCAN_BASE_URL: https://akira-scan.pages.dev
        run: |
          node scripts/cloud-hyper-run.mjs --hyper --all --full-catalog --all-chapters --no-deploy --no-git-sync

      - name: Rebuild catalogo-index
        run: npm run build:catalog-index
        continue-on-error: true

      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/nexustoons/state.json \
            data/nexustoons/manifest.json \
            data/catalogo.json \
            data/catalogo-index.json \
            data/cloud/chapters-index.json \
            2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot(full-sync): checkpoint cloud $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push || true

      - name: Deploy Cloudflare (opcional)
        if: inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT: akira-scan
          CF_PAGES_BRANCH: main
          AKIRA_SKIP_CLOUD_PAGES: "1"
        run: npm run deploy:cloudflare
        continue-on-error: true

      - name: Re-disparar até terminar
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/check-full-sync-pending.mjs; then
            echo "Ainda há obras/caps pendentes — próxima rodada em 60s…"
            sleep 60
            gh workflow run nexus-full-sync-cloud.yml \
              --ref "$(git rev-parse --abbrev-ref HEAD)" \
              -f deploy=false \
              -f manga_parallel=${{ inputs.manga_parallel || '2' }}
          else
            echo "Backfill completo — nada pendente na heurística."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sync-log-${{ github.run_id }}
          path: logs/migration-*.log
          if-no-files-found: ignore
          retention-days: 14
