name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "functions/**"
      - "scripts/prepare-cloudflare-deploy.mjs"
      - "scripts/deploy-cloudflare.mjs"
      - "scripts/verify-cloud-data.mjs"
      - "scripts/lib/chapter-index-utils.mjs"
      - ".github/workflows/deploy-cloudflare.yml"
      - "data/catalogo*.json"
      - "data/cloud/chapters-index.json"
      - "js/**"
      - "css/**"
      - "*.html"
  workflow_dispatch:
    inputs:
      auto_start_migration:
        description: "Disparar migração hyper após deploy (opcional)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Confirmar Node 22+ (Wrangler 4)
        run: |
          node -v
          node -e "const m=+process.versions.node.split('.')[0]; if(m<22){console.error('Node',process.versions.node); process.exit(1)}"

      - name: Verificar índice/catálogo
        run: node scripts/verify-cloud-data.mjs

      - name: Build + deploy (sem páginas locais — caps via API/Catbox/Telegra)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_PROJECT: akira-scan
          CF_PAGES_BRANCH: main
          AKIRA_SKIP_CLOUD_PAGES: "1"
        run: npm run deploy:cloudflare
