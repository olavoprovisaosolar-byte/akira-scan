<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Perfil — AkiraScan</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23060608'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' font-family='system-ui,sans-serif' fill='%23e8e8ec'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/akira.css">
</head>
<body class="akira-app">
    <div id="header-slot"></div>

    <main class="container container-narrow perfil-page">
        <section class="perfil-header">
            <label class="perfil-avatar-wrap" for="perfil-avatar-input" title="Alterar foto">
                <img class="perfil-avatar" id="perfil-avatar" alt="Avatar" src="">
                <span class="perfil-avatar-edit">📷</span>
                <input type="file" id="perfil-avatar-input" accept="image/*" hidden>
            </label>
            <div class="perfil-header-info">
                <input type="text" class="perfil-nome-input" id="perfil-nome" maxlength="32" placeholder="Teu nome de leitor" autocomplete="nickname">
                <p class="perfil-sub" id="perfil-sub">Leitor AkiraScan</p>
                <a href="login.html" class="perfil-login-link" id="perfil-login-link">Entrar para sincronizar na nuvem</a>
            </div>
        </section>

        <div class="perfil-stats sidebar-block">
            <div class="perfil-stat">
                <p class="perfil-stat-num" id="stat-lendo">0</p>
                <p class="perfil-stat-label">A ler</p>
            </div>
            <div class="perfil-stat">
                <p class="perfil-stat-num" id="stat-fav">0</p>
                <p class="perfil-stat-label">Favoritos</p>
            </div>
        </div>

        <section class="secao-akira" id="sec-continuar-perfil">
            <div class="secao-header"><h2>▶ Continuar lendo</h2></div>
            <div class="row-continuar" id="lista-continuar"></div>
        </section>

        <section class="secao-akira">
            <div class="secao-header">
                <h2>💖 Meus favoritos</h2>
                <a href="biblioteca.html?q=favoritos">Ver na biblioteca</a>
            </div>
            <div class="grid-favoritos" id="lista-favoritos"></div>
        </section>

        <button type="button" id="btn-limpar" class="btn-akira btn-akira-ghost perfil-limpar">Limpar histórico</button>
    </main>

    <div id="footer-slot"></div>

    <script type="module">
        import { initPerfilPage } from "./js/pages/perfil-page.js";
        await initPerfilPage();
    </script>
</body>
</html>
